[project]
name = "all-in-one-vision"
version = "0.1.0"
description = "Classification-focused computer vision project following Detectron2's architecture (LazyConfig, catalogs, hook-based engine)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "omegaconf>=2.3",
    "fvcore>=0.1.5",
    "mlflow>=3.0",
    "torchmetrics>=1.0",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["all_in_one_vision"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
